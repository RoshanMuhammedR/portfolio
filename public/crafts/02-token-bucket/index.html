<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>02 · Token bucket — Crafts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0c0d0c; --line: #232421; --muted: #6f706b; --dim: #a4a5a1; --text: #ecede9; --teal: #5ca59a; --red: #e5484d; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: radial-gradient(900px 600px at 30% 50%, #0f1a17 0%, var(--bg) 65%); color: var(--text); font-family: Geist, ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .meta { position: fixed; top: 24px; left: 28px; font: 500 12px/1.5 "Geist Mono", ui-monospace, monospace; color: var(--muted); }
  .meta b { color: var(--dim); font-weight: 500; }
  .controls { position: fixed; left: 28px; bottom: 24px; display: flex; gap: 18px; align-items: center; font: 500 12px/1 "Geist Mono", monospace; color: var(--muted); }
  button { all: unset; cursor: pointer; padding: 9px 14px; border: 1px solid var(--line); border-radius: 8px; color: var(--text); background: #131412; font: 500 12px/1 Geist, sans-serif; }
  button:hover { border-color: #3a3b37; }
  label { display: flex; gap: 10px; align-items: center; }
  input[type=range] { accent-color: var(--teal); width: 110px; }
</style>
</head>
<body>
<canvas id="c" aria-label="A token bucket rate limiter: requests take a token to pass, and are rejected with 429 when the bucket is empty"></canvas>
<div class="meta"><b>02</b> / Token bucket — capacity 12, refilling at a fixed rate</div>
<div class="controls">
  <button id="spike">Send a spike</button>
  <label>traffic <input id="rate" type="range" min="1" max="12" value="4"> <span id="rn">4</span>/s</label>
  <label>refill <input id="refill" type="range" min="1" max="8" value="3"> <span id="fn">3</span>/s</label>
</div>
<script>
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(23);
const c = document.getElementById("c"), g = c.getContext("2d");
let W = 0, H = 0, L = {};

const CAP = 12;
let tokens = CAP, traffic = 4, refill = 3;
let requests = [], drops = [];
const history = [];                // one entry per second: { ok, no }
let bucketSec = { ok: 0, no: 0 }, secClock = 0, arriveIn = 0, time = 0;

function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight; c.width = W * dpr; c.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const bw = Math.min(170, W * 0.14), bh = Math.min(250, H * 0.34);
  L = { lineY: H * 0.5, x0: W * 0.06, bx: W * 0.30, bw, bh, by: H * 0.5 - bh / 2, up: W * 0.52,
        cx: W * 0.60, cw: W * 0.33, cy: H * 0.5 - Math.min(150, H * 0.22), ch: Math.min(300, H * 0.44) };
}

function arrive() { requests.push({ x: L.x0, y: L.lineY, state: "in", v: 280 + rng() * 120 }); }

function step(dt) {
  time += dt;
  tokens = Math.min(CAP, tokens + refill * dt);
  arriveIn -= dt;
  if (arriveIn <= 0) { arrive(); arriveIn = -Math.log(1 - rng()) / traffic; }   // Poisson arrivals

  for (const r of requests) {
    if (r.state === "in") {
      r.x += r.v * dt;
      if (r.x >= L.bx - 6) {
        if (tokens >= 1) { tokens -= 1; r.state = "pass"; bucketSec.ok++; drops.push({ x: L.bx + L.bw / 2, y: L.by + 30, life: 1, ok: true }); }
        else { r.state = "reject"; r.vy = -60; bucketSec.no++; }
      }
    } else if (r.state === "pass") {
      r.x += r.v * 1.2 * dt;
      if (r.x > L.up) r.state = "gone";
    } else if (r.state === "reject") {
      r.vy += 900 * dt; r.y += r.vy * dt; r.x -= 30 * dt; r.life = (r.life ?? 1) - dt * 0.9;
      if (r.life <= 0) r.state = "gone";
    }
  }
  requests = requests.filter((r) => r.state !== "gone");
  for (const d of drops) d.life -= dt * 1.6;
  drops = drops.filter((d) => d.life > 0);

  secClock += dt;
  if (secClock >= 1) { secClock -= 1; history.push(bucketSec); bucketSec = { ok: 0, no: 0 }; if (history.length > 22) history.shift(); }
}

const mono = (s, x, y, col = "#6f706b", size = 11) => { g.fillStyle = col; g.font = `500 ${size}px "Geist Mono", monospace`; g.fillText(s, x, y); };

function draw() {
  g.clearRect(0, 0, W, H);

  // the wire
  g.strokeStyle = "#1f201d"; g.lineWidth = 1;
  g.beginPath(); g.moveTo(L.x0, L.lineY); g.lineTo(L.bx, L.lineY); g.moveTo(L.bx + L.bw, L.lineY); g.lineTo(L.up, L.lineY); g.stroke();
  mono("clients", L.x0, L.lineY - 16); mono("upstream", L.up - 50, L.lineY - 16);
  g.beginPath(); g.arc(L.up + 10, L.lineY, 6, 0, Math.PI * 2); g.fillStyle = "#5ca59a"; g.fill();

  // bucket
  g.beginPath(); g.roundRect(L.bx, L.by, L.bw, L.bh, 16);
  g.fillStyle = "rgba(18,26,24,.8)"; g.fill(); g.strokeStyle = "#2c3a36"; g.stroke();
  mono(`${Math.floor(tokens)}/${CAP} tokens`, L.bx, L.by - 14, "#a4a5a1");
  mono(`+${refill}/s`, L.bx + L.bw - 34, L.by - 14, "#5ca59a");

  // tap
  g.strokeStyle = "#2c3a36"; g.beginPath(); g.moveTo(L.bx + L.bw / 2, L.by - 46); g.lineTo(L.bx + L.bw / 2, L.by - 30); g.stroke();
  const phase = (time * refill) % 1;
  g.beginPath(); g.arc(L.bx + L.bw / 2, L.by - 30 + phase * 26, 3, 0, Math.PI * 2); g.fillStyle = `rgba(133,195,184,${1 - phase})`; g.fill();

  // tokens, stacked from the bottom
  const cols = 3, r = Math.min(16, L.bw / 8), gapX = L.bw / cols;
  const full = Math.floor(tokens), frac = tokens - full;
  for (let i = 0; i < CAP; i++) {
    const col = i % cols, row = Math.floor(i / cols);
    const x = L.bx + gapX * (col + 0.5), y = L.by + L.bh - 26 - row * (r * 2 + 8);
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2);
    if (i < full) { g.fillStyle = "#5ca59a"; g.shadowColor = "#5ca59a"; g.shadowBlur = 14; g.fill(); g.shadowBlur = 0; }
    else if (i === full && frac > 0.02) { g.fillStyle = `rgba(92,165,154,${frac * 0.6})`; g.fill(); }
    else { g.strokeStyle = "#232b28"; g.stroke(); }
  }

  for (const d of drops) { g.beginPath(); g.arc(d.x, d.y - (1 - d.life) * 40, 4 + (1 - d.life) * 6, 0, Math.PI * 2); g.strokeStyle = `rgba(133,195,184,${d.life})`; g.stroke(); }

  for (const req of requests) {
    const color = req.state === "reject" ? "#e5484d" : "#ecede9";
    g.globalAlpha = req.state === "reject" ? Math.max(0, req.life ?? 1) : 1;
    g.beginPath(); g.roundRect(req.x - 9, req.y - 4, 18, 8, 4); g.fillStyle = color; g.fill();
    if (req.state === "reject") mono("429", req.x - 10, req.y - 10, "#e5484d", 10);
    g.globalAlpha = 1;
  }

  // chart
  g.beginPath(); g.roundRect(L.cx, L.cy, L.cw, L.ch, 14); g.fillStyle = "rgba(19,20,18,.85)"; g.fill(); g.strokeStyle = "#232421"; g.stroke();
  mono("requests per second", L.cx + 18, L.cy + 26, "#a4a5a1");
  mono("● accepted", L.cx + L.cw - 170, L.cy + 26, "#5ca59a"); mono("● 429", L.cx + L.cw - 70, L.cy + 26, "#e5484d");
  const bars = 22, pad = 18, bw = (L.cw - pad * 2) / bars, base = L.cy + L.ch - 30, maxH = L.ch - 80;
  const peak = Math.max(8, ...history.map((h) => h.ok + h.no));
  history.forEach((h, i) => {
    const x = L.cx + pad + (bars - history.length + i) * bw;
    const okH = (h.ok / peak) * maxH, noH = (h.no / peak) * maxH;
    g.fillStyle = "#5ca59a"; g.beginPath(); g.roundRect(x + 2, base - okH, bw - 4, okH, 2); g.fill();
    if (noH) { g.fillStyle = "#e5484d"; g.beginPath(); g.roundRect(x + 2, base - okH - noH - 2, bw - 4, noH, 2); g.fill(); }
  });
  g.strokeStyle = "#232421"; g.beginPath(); g.moveTo(L.cx + pad, base + 6); g.lineTo(L.cx + L.cw - pad, base + 6); g.stroke();
  const ok = history.reduce((s, h) => s + h.ok, 0), no = history.reduce((s, h) => s + h.no, 0);
  mono(`${ok} accepted · ${no} rejected · last ${history.length}s`, L.cx + 18, base + 22);
}

function spike() { for (let i = 0; i < 16; i++) requests.push({ x: L.x0 - i * 26, y: L.lineY, state: "in", v: 340 }); }

let last = performance.now();
function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; step(dt); draw(); requestAnimationFrame(loop); }

addEventListener("resize", resize);
document.getElementById("spike").onclick = spike;
document.getElementById("rate").oninput = (e) => { traffic = +e.target.value; document.getElementById("rn").textContent = traffic; };
document.getElementById("refill").oninput = (e) => { refill = +e.target.value; document.getElementById("fn").textContent = refill; };

resize();
// Warm up: steady traffic, then a spike, so the first frame shows both outcomes.
for (let i = 0; i < 60 * 14; i++) { step(1 / 60); if (i === 60 * 9 || i === 60 * 12) spike(); }
requestAnimationFrame(loop);
</script>
</body>
</html>
