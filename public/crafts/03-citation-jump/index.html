<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>03 · Citation jump — Crafts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Newsreader:ital,wght@1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8f9fa; --card: #fff; --muted: #f1f3f4; --strong: #e8eaed; --ink: #1f1f1f; --mf: #5f6368; --ms: #9aa0a6;
    --p: #f6552c; --border: #dadce0; --bsoft: #e8eaed; --bstrong: #c7cacf; --ok: #148662;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 15px/1.5 "Plus Jakarta Sans", system-ui, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
  svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  :focus-visible { outline: 2px solid var(--p); outline-offset: 2px; }

  .bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid var(--bsoft); background: var(--card); font-size: 12px; color: var(--mf); }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; color: var(--ink); }
  .logo { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, #ff7a57, #f6552c 55%, #e0431b); }
  .scroll { flex: 1; overflow-y: auto; }

  .caps { font-size: 11px; line-height: 1.4; letter-spacing: .08em; font-weight: 600; text-transform: uppercase; color: var(--mf); }
  .pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 4px 10px; background: var(--strong); color: var(--mf); font-size: 11px; line-height: 1.4; letter-spacing: .08em; font-weight: 600; text-transform: uppercase; white-space: nowrap; }
  .tile { border-radius: 6px; display: grid; place-items: center; flex-shrink: 0; }
  .tile svg { stroke-width: 1.75; }
  .tile.pdf { background: rgb(152 185 221 / .25); color: #4d79a8; } .tile.audio { background: rgb(185 132 62 / .25); color: #8a5f24; }

  /* answer view */
  .answer { max-width: 768px; margin: 0 auto; padding: 32px; display: flex; flex-direction: column; gap: 16px; }
  .user { align-self: flex-end; max-width: 85%; background: var(--strong); border-radius: 8px 8px 2px 8px; padding: 12px 16px; font-weight: 500; }
  .prose { line-height: 1.625; margin: 8px 0 0; }
  .card { display: flex; align-items: flex-start; gap: 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); padding: 12px; text-align: left; width: 100%; transition: border-color 150ms cubic-bezier(.4,0,.2,1); }
  .card:hover { border-color: var(--bstrong); }
  .card .tile { width: 32px; height: 32px; font-size: 18px; }
  .card .body { flex: 1; min-width: 0; }
  .card .row1 { display: flex; align-items: center; gap: 8px; }
  .card .t { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .card .rel { font-size: 12px; margin-left: auto; white-space: nowrap; }
  .card .ex { font: italic 13px/1.625 Newsreader, Georgia, serif; color: var(--mf); margin: 4px 0 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card > .chev { color: var(--ms); font-size: 16px; margin-top: 8px; }

  /* viewer */
  .vhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 32px; border-bottom: 1px solid var(--bsoft); background: var(--card); }
  .vtitle { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .vtitle .tile { width: 36px; height: 36px; font-size: 18px; }
  .vtitle h1 { margin: 0; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vtitle p { margin: 0; font-size: 12px; color: var(--mf); }
  .vactions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .stepper { display: flex; align-items: center; gap: 4px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); padding: 4px 8px; font-size: 12px; color: var(--mf); }
  .stepper button { width: 28px; height: 28px; border-radius: 4px; display: grid; place-items: center; font-size: 16px; color: var(--ink); }
  .stepper button:disabled { opacity: .4; cursor: default; }
  .back { height: 36px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 6px; background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 500; }
  .back svg { font-size: 14px; }
  .details { height: 36px; display: inline-flex; align-items: center; padding: 0 12px; border-radius: 6px; border: 1px solid var(--bstrong); background: var(--card); font-size: 13px; font-weight: 500; }

  .vbody { display: grid; gap: 24px; padding: 24px 32px; }
  @media (min-width: 1024px) { .vbody { grid-template-columns: 1.6fr 1fr; align-items: start; } }
  .panel { border: 1px solid var(--border); border-radius: 8px; background: var(--card); overflow: hidden; }
  .strip { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--muted); }
  .strip .of { font: 12px "JetBrains Mono", monospace; color: var(--ms); }
  .note { padding: 20px 20px 0; margin: 0; font-size: 12px; color: var(--mf); }
  .reader { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .reader p { margin: 0; line-height: 1.625; }
  .reader .ctx { color: var(--mf); }
  .reader .hl { border-radius: 6px; background: rgb(246 85 44 / .1); padding: 12px; box-shadow: 0 0 0 1px rgb(246 85 44 / .3); }
  .reader mark { background: transparent; color: var(--ink); font-weight: 500; }
  .skeleton { border-radius: 4px; background-image: linear-gradient(90deg, var(--muted) 0%, #f7f8f9 50%, var(--muted) 100%); background-size: 200% 100%; animation: shimmer 1.6s linear infinite; }
  @keyframes shimmer { 0% { background-position: -200% 0 } 100% { background-position: 200% 0 } }

  .side { display: flex; flex-direction: column; gap: 16px; }
  .side .panel { padding: 20px; }
  .side .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
  .side .rel { font-size: 12px; color: var(--mf); }
  .side .explain { margin: 12px 0 0; font-size: 13px; line-height: 1.625; color: var(--mf); }
  .side ol { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .item { width: 100%; text-align: left; border: 1px solid var(--border); border-radius: 6px; padding: 12px; font-size: 13px; }
  .item:hover { border-color: var(--bstrong); }
  .item[aria-current="true"] { border-color: var(--ink); }
  .item b { font-weight: 600; }
  .item span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 4px; font: italic 13px/1.5 Newsreader, Georgia, serif; color: var(--mf); }
  .foot { padding: 0 32px 24px; font-size: 11px; color: var(--ms); }
  @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }
</style>
</head>
<body>
<header class="bar"><span class="brand"><span class="logo" aria-hidden="true"></span>Saga</span><span>Craft 03 · rebuilt from Saga · sample data</span><span></span></header>
<main class="scroll" id="app"></main>

<script>
const ICON = {
  pdf: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/>',
  audio: '<path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/>',
  right: '<path d="m9 18 6-6-6-6"/>', left: '<path d="m15 18-6-6 6-6"/>', back: '<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>'
};
const icon = (k) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;

/* ---- sample data: cited excerpts are the repo's fictional demo content; neighbours and page count are made up ---- */
const SOURCES = {
  a1: { title: "Northwind Logistics — Q2 2026 filing", filename: "northwind-q2-2026-10q.pdf", source_type: "pdf", pages: 38 },
  a2: { title: "Northwind Q2 earnings call", filename: "northwind-q2-earnings-call.mp3", source_type: "audio" }
};
const CITATIONS = [
  { asset_id: "a1", locator: { type: "page", value: 14 }, chunk_index: 61, score: .89, excerpt: "Contracted haulage rates increased 11.2% year on year following the Q1 renewal cycle. The Company elected to absorb the increase for shippers under existing contract terms, which reduced gross margin by approximately 180 basis points." },
  { asset_id: "a1", locator: { type: "page", value: 22 }, chunk_index: 94, score: .81, excerpt: "Bonded warehousing revenue grew 4% against 19% for general fulfilment. As bonded carries a materially higher margin, the shift in mix reduced blended gross margin independently of any change within individual service lines." },
  { asset_id: "a2", locator: { type: "timestamp", value: 1447 }, chunk_index: 38, score: .74, excerpt: "On freight, assume that persists through the third quarter. On mix, Rotterdam comes online in September and we'd expect the bonded share to recover from there." }
];
const PASSAGES = {
  61: { before: ["Revenue for the quarter was broadly flat against the prior year, with volume gains in fulfilment offset by softer pricing in the spot market.", "Cost of services rose faster than revenue, driven principally by freight."],
        after: ["The Company expects to revisit contract terms at the next renewal cycle.", "No change was made to the depreciation policy during the period."] },
  94: { before: ["Segment results are presented on a service-line basis."], after: ["Management continues to monitor the bonded share of revenue as a leading indicator of blended margin."] },
  38: { before: ["Moving on to the outlook."], after: ["Happy to take questions."] }
};
const ANSWER = "Two things, mostly: freight costs Northwind absorbed [1], and a mix shift toward lower-margin fulfilment [2]. Management expects freight pressure to persist through Q3 [3].";

const formatLocator = (l) => (l.type === "page" ? `Page ${l.value}` : `${Math.floor(l.value / 60)}:${String(l.value % 60).padStart(2, "0")}`);
const relColour = (s) => (s >= .8 ? "var(--ok)" : s >= .6 ? "var(--mf)" : "var(--ms)");
const typeLabel = { pdf: "PDF", audio: "Audio" };

/* ---- stand-ins for getPassages: an in-memory lookup, slow once so the skeleton shows ---- */
let firstOpen = true;
const getPassages = (chunk) => new Promise((res) => setTimeout(() => res(PASSAGES[chunk]), firstOpen ? 250 : 0)).finally(() => (firstOpen = false));

const app = document.getElementById("app");
let view = "answer", index = 0, passages = null;

function renderAnswer() {
  app.innerHTML = `<div class="answer">
    <div class="user">What drove the margin decline at Northwind in Q2?</div>
    <p class="prose">${ANSWER}</p>
    <span class="caps">${CITATIONS.length} cited passages</span>
    ${CITATIONS.map((c, i) => { const s = SOURCES[c.asset_id]; return `
      <button class="card" data-open="${i}">
        <span class="tile ${s.source_type}">${icon(s.source_type)}</span>
        <span class="body"><span class="row1"><span class="t">${s.filename}</span><span class="pill">${formatLocator(c.locator)}</span><span class="rel" style="color:${relColour(c.score)}">${Math.round(c.score * 100)}% relevance</span></span>
        <span class="ex">“${c.excerpt}”</span></span>
        <span class="chev">${icon("right")}</span>
      </button>`; }).join("")}
    <p class="foot" style="padding:0">Click a cited passage to open its source at the exact spot.</p>
  </div>`;
}

function renderViewer() {
  const c = CITATIONS[index], s = SOURCES[c.asset_id];
  const reader = passages
    ? `${passages.before.map((t) => `<p class="ctx">${t}</p>`).join("")}<p class="hl" id="hl"><mark>${c.excerpt}</mark></p>${passages.after.map((t) => `<p class="ctx">${t}</p>`).join("")}`
    : `<div class="skeleton" style="height:32px;width:33%"></div><div class="skeleton" style="height:256px"></div>`;
  app.innerHTML = `
    <header class="vhead">
      <div class="vtitle"><span class="tile ${s.source_type}">${icon(s.source_type)}</span><div style="min-width:0"><h1>${s.title}</h1><p>${typeLabel[s.source_type]} · ${s.filename}</p></div></div>
      <div class="vactions">
        <div class="stepper"><button aria-label="Previous citation" data-step="-1" ${index === 0 ? "disabled" : ""}>${icon("left")}</button><span>Citation ${index + 1} of ${CITATIONS.length}</span><button aria-label="Next citation" data-step="1" ${index >= CITATIONS.length - 1 ? "disabled" : ""}>${icon("right")}</button></div>
        <button class="back" data-back>${icon("back")} Back to the answer</button>
        <button class="details">Source details</button>
      </div>
    </header>
    <div class="vbody">
      <div class="panel">
        <div class="strip"><span class="caps">${formatLocator(c.locator)}</span>${s.pages ? `<span class="of">of ${s.pages} pages</span>` : ""}</div>
        ${s.source_type === "audio" ? `<p class="note">From ${formatLocator(c.locator)} — the cited line is highlighted below.</p>` : ""}
        <div class="reader" aria-live="polite">${reader}</div>
      </div>
      <div class="side">
        <div class="panel"><span class="caps">This citation</span>
          <div class="row"><span class="pill">${formatLocator(c.locator)}</span><span class="rel">${Math.round(c.score * 100)}% relevance</span></div>
          <p class="explain">Saga retrieved this passage because it was among the closest matches to your question. Relevance is how close, not how correct — read it and decide.</p></div>
        <div class="panel"><span class="caps">All citations in that answer</span>
          <ol>${CITATIONS.map((x, i) => `<li><button class="item" data-jump="${i}" ${i === index ? 'aria-current="true"' : ""}><b>${formatLocator(x.locator)}</b><span>${x.excerpt}</span></button></li>`).join("")}</ol></div>
      </div>
    </div>
    <p class="foot">Demo addition, not in the original: the highlighted passage scrolls into view when the citation changes.</p>`;
}

function render() { view === "answer" ? renderAnswer() : renderViewer(); }

async function openCitation(i) {
  index = i; view = "viewer"; passages = null; render();
  // Re-fetch the cited passage with its neighbours, then re-render before / highlight / after.
  const fetched = await getPassages(CITATIONS[i].chunk_index);
  if (index !== i || view !== "viewer") return;
  passages = fetched; render();
  document.getElementById("hl")?.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}

app.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  if (b.dataset.open) openCitation(+b.dataset.open);
  else if (b.dataset.step) openCitation(Math.max(0, Math.min(CITATIONS.length - 1, index + +b.dataset.step)));
  else if (b.dataset.jump) openCitation(+b.dataset.jump);
  else if (b.hasAttribute("data-back")) { view = "answer"; render(); }
});

render();
if (new URLSearchParams(location.search).has("shot")) { view = "viewer"; index = 0; passages = PASSAGES[61]; render(); }
</script>
</body>
</html>
