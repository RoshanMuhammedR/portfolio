<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>03 · Nearest neighbours — Crafts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b0c0b; --line: #232421; --muted: #6f706b; --dim: #a4a5a1; --text: #ecede9; --teal: #5ca59a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: Geist, ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
  .meta { position: fixed; top: 24px; left: 28px; font: 500 12px/1.5 "Geist Mono", ui-monospace, monospace; color: var(--muted); pointer-events: none; }
  .meta b { color: var(--dim); font-weight: 500; }
  .hint { position: fixed; left: 28px; bottom: 24px; font: 500 12px/1 "Geist Mono", monospace; color: var(--muted); pointer-events: none; }
  aside { position: fixed; top: 50%; right: 4vw; transform: translateY(-50%); width: min(340px, 30vw); padding: 22px; border: 1px solid var(--line); border-radius: 14px; background: rgba(18,19,17,.86); backdrop-filter: blur(8px); }
  aside h2 { margin: 0 0 4px; font: 500 11px/1 "Geist Mono", monospace; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  aside .q { margin: 10px 0 18px; font: 500 15px/1.4 Geist, sans-serif; letter-spacing: -.01em; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; align-items: center; font: 400 13px/1.3 Geist, sans-serif; }
  li .n { font: 500 11px "Geist Mono", monospace; color: var(--muted); }
  li .doc { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .doc small { display: block; margin-top: 3px; font: 400 11px "Geist Mono", monospace; color: var(--muted); }
  li .s { font: 500 12px "Geist Mono", monospace; color: var(--teal); }
  .bar { grid-column: 2 / 4; height: 3px; border-radius: 2px; background: #1c1d1b; overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #2c5954, #5ca59a); }
</style>
</head>
<body>
<canvas id="c" aria-label="Documents embedded as points; the query's nearest neighbours are connected and ranked"></canvas>
<div class="meta"><b>03</b> / Nearest neighbours — top-k retrieval over embedded chunks</div>
<div class="hint">move to query · click to pin</div>
<aside aria-live="polite">
  <h2>query</h2>
  <div class="q" id="q">how are ingestion jobs retried?</div>
  <h2>top 6 chunks</h2>
  <ol id="results" style="margin-top:12px"></ol>
</aside>
<script>
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(5);
const gauss = () => Math.sqrt(-2 * Math.log(1 - rng())) * Math.cos(2 * Math.PI * rng());

const clusters = [
  { name: "ingestion", at: [0.30, 0.38], tint: "92,165,154", files: ["worker/tasks.py", "ingest/pipeline.md", "celery/retry.py", "loaders/pdf.py"], q: "how are ingestion jobs retried?" },
  { name: "retrieval", at: [0.50, 0.30], tint: "133,195,184", files: ["search/hnsw.sql", "retrieve/rank.py", "docs/citations.md"], q: "which index answers similarity queries?" },
  { name: "auth", at: [0.22, 0.70], tint: "164,165,161", files: ["auth/session.ts", "guards/rbac.ts", "docs/oauth.md"], q: "where are sessions validated?" },
  { name: "billing", at: [0.52, 0.72], tint: "232,163,60", files: ["credits/meter.ts", "billing/batch.ts", "docs/limits.md"], q: "how is usage metered?" },
  { name: "infra", at: [0.40, 0.55], tint: "120,140,160", files: ["deploy/compose.yml", "proxy/Caddyfile", "docs/scale.md"], q: "how do idle apps scale down?" },
];
const points = [];
clusters.forEach((cl, ci) => {
  for (let i = 0; i < 34; i++) {
    points.push({ x: cl.at[0] + gauss() * 0.055, y: cl.at[1] + gauss() * 0.06, c: ci, label: `${cl.files[i % cl.files.length]} #${1 + (i % 9)}` });
  }
});

const c = document.getElementById("c"), g = c.getContext("2d");
let W = 0, H = 0, plotW = 0;
let query = { x: 0.335, y: 0.44 }, pinned = true, t = 0;

function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight; c.width = W * dpr; c.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
  plotW = W * 0.64;
}
const px = (p) => [p.x * plotW + W * 0.02, p.y * H];

function neighbours() {
  return points
    .map((p) => ({ p, d: Math.hypot(p.x - query.x, (p.y - query.y) * 0.9) }))
    .sort((a, b) => a.d - b.d)
    .slice(0, 6)
    .map((r) => ({ ...r, s: Math.max(0, 1 - r.d * 3.2) }));
}

let lastKey = "";
function panel(top) {
  const nearest = clusters[top[0].p.c];
  const key = top.map((r) => r.p.label).join("|");
  if (key === lastKey) return;
  lastKey = key;
  document.getElementById("q").textContent = nearest.q;
  document.getElementById("results").innerHTML = top.map((r, i) => `
    <li><span class="n">${i + 1}</span><span class="doc">${r.p.label}<small>${clusters[r.p.c].name}</small></span><span class="s">${r.s.toFixed(3)}</span>
    <span></span><span class="bar"><i style="width:${(r.s * 100).toFixed(1)}%"></i></span></li>`).join("");
}

function draw() {
  t += 1 / 60;
  g.clearRect(0, 0, W, H);

  // faint lattice
  g.strokeStyle = "rgba(255,255,255,.035)"; g.lineWidth = 1;
  for (let x = W * 0.02; x < plotW + W * 0.02; x += 48) { g.beginPath(); g.moveTo(x, 70); g.lineTo(x, H - 60); g.stroke(); }
  for (let y = 70; y < H - 60; y += 48) { g.beginPath(); g.moveTo(W * 0.02, y); g.lineTo(plotW + W * 0.02, y); g.stroke(); }

  clusters.forEach((cl) => {
    const [x, y] = px({ x: cl.at[0], y: cl.at[1] - 0.13 });
    g.font = '500 11px "Geist Mono", monospace'; g.fillStyle = `rgba(${cl.tint},.55)`; g.fillText(cl.name, x - 24, y);
  });

  const top = neighbours();
  const hit = new Set(top.map((r) => r.p));
  const [qx, qy] = px(query);

  top.forEach((r, i) => {
    const [x, y] = px(r.p);
    g.strokeStyle = `rgba(92,165,154,${0.75 - i * 0.1})`; g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(qx, qy); g.lineTo(x, y); g.stroke();
  });

  for (const p of points) {
    const [x, y] = px(p);
    const on = hit.has(p);
    g.beginPath(); g.arc(x, y, on ? 5 : 2.6, 0, Math.PI * 2);
    g.fillStyle = on ? "#85c3b8" : `rgba(${clusters[p.c].tint},.5)`;
    if (on) { g.shadowColor = "#5ca59a"; g.shadowBlur = 16; }
    g.fill(); g.shadowBlur = 0;
  }

  const pulse = (t % 1.6) / 1.6;
  g.beginPath(); g.arc(qx, qy, 8 + pulse * 26, 0, Math.PI * 2); g.strokeStyle = `rgba(236,237,233,${0.5 * (1 - pulse)})`; g.stroke();
  g.beginPath(); g.arc(qx, qy, 7, 0, Math.PI * 2); g.fillStyle = "#ecede9"; g.fill();
  g.font = '500 11px "Geist Mono", monospace'; g.fillStyle = "#ecede9"; g.fillText(pinned ? "query · pinned" : "query", qx + 14, qy - 12);

  panel(top);
  requestAnimationFrame(draw);
}

c.addEventListener("pointermove", (e) => {
  if (pinned) return;
  query = { x: Math.min(0.98, Math.max(0.02, (e.clientX - W * 0.02) / plotW)), y: e.clientY / H };
});
c.addEventListener("click", (e) => {
  pinned = !pinned;
  if (!pinned) query = { x: (e.clientX - W * 0.02) / plotW, y: e.clientY / H };
});
addEventListener("resize", resize);
resize();
requestAnimationFrame(draw);
</script>
</body>
</html>
