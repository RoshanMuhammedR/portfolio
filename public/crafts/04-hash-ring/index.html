<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>04 · Consistent hashing — Crafts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0c0d0c; --line: #232421; --muted: #6f706b; --dim: #a4a5a1; --text: #ecede9; --teal: #5ca59a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: radial-gradient(700px 700px at 42% 52%, #111a18 0%, var(--bg) 70%); color: var(--text); font-family: Geist, ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .meta { position: fixed; top: 24px; left: 28px; font: 500 12px/1.5 "Geist Mono", ui-monospace, monospace; color: var(--muted); }
  .meta b { color: var(--dim); font-weight: 500; }
  .controls { position: fixed; left: 28px; bottom: 24px; display: flex; gap: 10px; }
  button { all: unset; cursor: pointer; padding: 9px 14px; border: 1px solid var(--line); border-radius: 8px; color: var(--text); background: #131412; font: 500 12px/1 Geist, sans-serif; }
  button:hover { border-color: #3a3b37; }
  aside { position: fixed; top: 50%; right: 5vw; transform: translateY(-50%); width: min(300px, 28vw); padding: 22px; border: 1px solid var(--line); border-radius: 14px; background: rgba(18,19,17,.86); }
  h2 { margin: 0 0 16px; font: 500 11px/1 "Geist Mono", monospace; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .row { display: grid; grid-template-columns: 56px 1fr 34px; gap: 10px; align-items: center; margin-bottom: 12px; font: 500 12px/1 "Geist Mono", monospace; color: var(--dim); }
  .track { height: 6px; border-radius: 3px; background: #1b1c1a; overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 3px; transition: width .6s cubic-bezier(.22,1,.36,1); }
  .moved { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); font: 400 13px/1.45 Geist, sans-serif; color: var(--dim); }
  .moved b { display: block; margin-bottom: 4px; font: 600 24px/1 Geist, sans-serif; letter-spacing: -.02em; color: var(--text); }
</style>
</head>
<body>
<canvas id="c" aria-label="A consistent hash ring: nodes own the arc up to their position, so adding a node only moves the keys on one arc"></canvas>
<div class="meta"><b>04</b> / Consistent hashing — three virtual nodes per server</div>
<div class="controls"><button id="add">Add node</button><button id="remove">Remove node</button></div>
<aside>
  <h2>keys per node</h2>
  <div id="load"></div>
  <div class="moved" id="moved"><b>—</b>keys moved on the last change</div>
</aside>
<script>
const PALETTE = ["#5ca59a", "#85c3b8", "#e8a33c", "#8fa3c4", "#c98bb9", "#a4a5a1"];
const NAMES = ["cache-a", "cache-b", "cache-c", "cache-d", "cache-e", "cache-f"];
const VNODES = 3, KEYS = 84;
const TAU = Math.PI * 2;

// FNV-1a, folded onto the circle.
function angleOf(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); } return ((h >>> 0) / 4294967296) * TAU; }

let nodes = [];
const keys = Array.from({ length: KEYS }, (_, i) => ({ name: `user:${1000 + i * 37}`, a: angleOf(`user:${1000 + i * 37}`), owner: -1, flash: 0 }));

function ring() {
  return nodes.flatMap((n) => Array.from({ length: VNODES }, (_, v) => ({ node: n.id, a: angleOf(`${n.name}#${v}`) }))).sort((x, y) => x.a - y.a);
}

function assign(highlight) {
  const r = ring();
  let moved = 0;
  for (const k of keys) {
    const owner = (r.find((v) => v.a >= k.a) ?? r[0]).node;
    if (highlight && k.owner !== -1 && owner !== k.owner) { moved++; k.flash = 1; }
    k.owner = owner;
  }
  return moved;
}

function panel(moved) {
  document.getElementById("load").innerHTML = nodes.map((n) => {
    const count = keys.filter((k) => k.owner === n.id).length;
    return `<div class="row"><span>${n.name}</span><span class="track"><i style="width:${(count / KEYS) * 100 * 2.2}%;background:${n.color}"></i></span><span>${count}</span></div>`;
  }).join("");
  if (moved !== undefined) document.getElementById("moved").innerHTML = `<b>${moved} / ${KEYS}</b>keys moved on the last change — only the arc the new node took over, not a full reshuffle`;
}

function add() {
  if (nodes.length >= NAMES.length) return;
  const id = nodes.length;
  nodes.push({ id, name: NAMES[id], color: PALETTE[id], born: 1 });
  panel(assign(true));
}
function remove() {
  if (nodes.length <= 2) return;
  nodes.pop();
  panel(assign(true));
}

const c = document.getElementById("c"), g = c.getContext("2d");
let W = 0, H = 0, cx = 0, cy = 0, R = 0, spin = 0;
function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight; c.width = W * dpr; c.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W * 0.38; cy = H * 0.52; R = Math.min(W * 0.26, H * 0.34);
}

function draw() {
  g.clearRect(0, 0, W, H);
  spin += 0.0006;
  const at = (a, rad) => [cx + Math.cos(a - Math.PI / 2 + spin) * rad, cy + Math.sin(a - Math.PI / 2 + spin) * rad];

  // ownership arcs
  const r = ring();
  r.forEach((v, i) => {
    const prev = r[(i - 1 + r.length) % r.length];
    let start = prev.a, end = v.a; if (end <= start) end += TAU;
    g.beginPath(); g.arc(cx, cy, R, start - Math.PI / 2 + spin, end - Math.PI / 2 + spin);
    g.strokeStyle = nodes[v.node].color; g.globalAlpha = 0.28; g.lineWidth = 14; g.stroke();
  });
  g.globalAlpha = 1; g.lineWidth = 1;
  g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.strokeStyle = "#262724"; g.stroke();

  for (const k of keys) {
    const [x, y] = at(k.a, R);
    const col = nodes[k.owner]?.color ?? "#6f706b";
    if (k.flash > 0) {
      g.beginPath(); g.arc(x, y, 5 + k.flash * 12, 0, TAU); g.strokeStyle = `rgba(236,237,233,${k.flash * 0.7})`; g.stroke();
      k.flash = Math.max(0, k.flash - 0.004);
    }
    g.beginPath(); g.arc(x, y, 3.2, 0, TAU); g.fillStyle = col; g.fill();
  }

  r.forEach((v) => {
    const n = nodes[v.node];
    const [x, y] = at(v.a, R + 26);
    g.beginPath(); g.roundRect(x - 7, y - 7, 14, 14, 3); g.fillStyle = "#0c0d0c"; g.fill(); g.strokeStyle = n.color; g.lineWidth = 2; g.stroke(); g.lineWidth = 1;
  });

  g.font = '500 12px "Geist Mono", monospace'; g.fillStyle = "#a4a5a1"; g.textAlign = "center";
  g.fillText(`${nodes.length} nodes · ${nodes.length * VNODES} positions`, cx, cy - 4);
  g.fillStyle = "#6f706b"; g.fillText(`${KEYS} keys`, cx, cy + 16);
  g.textAlign = "start";
  requestAnimationFrame(draw);
}

addEventListener("resize", resize);
document.getElementById("add").onclick = add;
document.getElementById("remove").onclick = remove;
resize();
for (let i = 0; i < 4; i++) { nodes.push({ id: i, name: NAMES[i], color: PALETTE[i] }); }
assign(false); panel();
setTimeout(add, 900);   // show a live rebalance shortly after load
requestAnimationFrame(draw);
</script>
</body>
</html>
