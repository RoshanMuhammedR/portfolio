<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>05 · LRU cache — Crafts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0c0d0c; --line: #232421; --muted: #6f706b; --dim: #a4a5a1; --text: #ecede9; --teal: #5ca59a; --amber: #e8a33c; --red: #e5484d; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: radial-gradient(900px 520px at 50% 40%, #121816 0%, var(--bg) 70%); color: var(--text); font-family: Geist, ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
  .meta { position: fixed; top: 24px; left: 28px; font: 500 12px/1.5 "Geist Mono", ui-monospace, monospace; color: var(--muted); }
  .meta b { color: var(--dim); font-weight: 500; }
  .panel { width: min(1040px, 90vw); }
  .head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 26px; gap: 24px; }
  h1 { margin: 0; font: 600 30px/1.1 Geist, sans-serif; letter-spacing: -.025em; }
  .sub { margin-top: 10px; font: 500 12px "Geist Mono", monospace; color: var(--muted); }
  .stats { display: flex; gap: 30px; }
  .stat { font: 500 11px "Geist Mono", monospace; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .stat b { display: block; margin-top: 8px; font: 600 24px/1 Geist, sans-serif; letter-spacing: -.02em; color: var(--text); text-transform: none; }
  .stat.h b { color: var(--teal); }
  .lane { position: relative; height: 140px; border: 1px solid var(--line); border-radius: 16px; background: rgba(17,18,16,.9); }
  .ends { display: flex; justify-content: space-between; margin: 0 4px 10px; font: 500 11px "Geist Mono", monospace; color: var(--muted); }
  .item { position: absolute; top: 20px; left: 20px; height: 98px; padding: 14px 15px; border: 1px solid #262724; border-radius: 11px; background: #151614;
          transition: transform .6s cubic-bezier(.22,1,.36,1), opacity .45s, border-color .35s, box-shadow .35s; }
  .instant .item { transition: none; }
  .item .k { font: 600 15px/1 Geist, sans-serif; letter-spacing: -.01em; }
  .item .v { margin-top: 8px; font: 400 11px/1.4 "Geist Mono", monospace; color: var(--muted); }
  .item .age { position: absolute; left: 15px; bottom: 12px; font: 500 10px "Geist Mono", monospace; color: #55574f; text-transform: uppercase; letter-spacing: .05em; }
  .item.hit { border-color: var(--teal); box-shadow: 0 0 0 1px rgba(92,165,154,.4), 0 10px 40px -12px rgba(92,165,154,.6); }
  .item.new { border-color: var(--amber); box-shadow: 0 10px 40px -14px rgba(232,163,60,.55); }
  .item.last .age { color: var(--red); }
  .item.gone { opacity: 0; border-color: var(--red); }
  .bottom { display: grid; grid-template-columns: 1fr 300px; gap: 28px; margin-top: 26px; }
  .log { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 30px; align-content: start; }
  .op { display: grid; grid-template-columns: 56px 1fr; font: 400 13px/1.2 "Geist Mono", monospace; color: var(--dim); }
  .op .b { font-weight: 500; font-size: 11px; letter-spacing: .05em; }
  .b.hit { color: var(--teal); } .b.miss { color: var(--amber); } .b.evict { color: var(--red); }
  form { display: flex; flex-direction: column; gap: 10px; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: #111210; }
  form label { font: 500 11px "Geist Mono", monospace; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .row { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid #262724; border-radius: 8px; background: #0c0d0c; color: var(--text); font: 400 13px "Geist Mono", monospace; outline: none; }
  input:focus { border-color: var(--teal); }
  button { all: unset; cursor: pointer; padding: 10px 14px; border-radius: 8px; background: var(--teal); color: #0b1412; font: 600 13px Geist, sans-serif; }
  .note { font: 400 12px/1.5 Geist, sans-serif; color: var(--muted); }
</style>
</head>
<body>
<div class="meta"><b>05</b> / LRU cache — a hit moves to the front, a miss evicts the back</div>
<main class="panel">
  <div class="head">
    <div><h1>Least recently used</h1><div class="sub">capacity 6 · Zipf-shaped traffic over 14 keys</div></div>
    <div class="stats">
      <div class="stat h">hit ratio<b id="ratio">—</b></div>
      <div class="stat">hits<b id="hits">0</b></div>
      <div class="stat">misses<b id="misses">0</b></div>
      <div class="stat">evictions<b id="evictions">0</b></div>
    </div>
  </div>
  <div class="ends"><span>← most recent</span><span>evicted next →</span></div>
  <div class="lane instant" id="lane"></div>
  <div class="bottom">
    <div class="log" id="log" aria-live="polite"></div>
    <form id="form">
      <label for="key">get a key</label>
      <div class="row"><input id="key" value="user:3" autocomplete="off"><button>get</button></div>
      <p class="note">Traffic keeps running underneath. A key already in the cache is a hit and jumps to the front.</p>
    </form>
  </div>
</main>
<script>
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(42);
const CAP = 6, KEYS = 14;
const lane = document.getElementById("lane");
let order = [];
const els = new Map();
const s = { hits: 0, misses: 0, evictions: 0 };
const ops = [];

// Zipf weights: a few keys are hot, most are cold - which is what makes LRU pay.
const weights = Array.from({ length: KEYS }, (_, i) => 1 / Math.pow(i + 1, 1.15));
const total = weights.reduce((a, b) => a + b, 0);
function pick() { let r = rng() * total; for (let i = 0; i < KEYS; i++) { r -= weights[i]; if (r <= 0) return `user:${i + 1}`; } return `user:${KEYS}`; }

function make(key) {
  const n = +key.split(":")[1];
  const el = document.createElement("div");
  el.className = "item";
  el.innerHTML = `<div class="k">${key}</div><div class="v">plan:${["free", "pro", "team"][n % 3]} · seats:${(n % 7) + 1}</div><div class="age"></div>`;
  el.style.opacity = "0";
  lane.appendChild(el);
  return el;
}

function layout() {
  const w = lane.clientWidth, gap = 12, slot = (w - 40 - gap * (CAP - 1)) / CAP;
  order.forEach((k, i) => {
    const el = els.get(k);
    el.style.width = `${slot}px`;
    el.style.transform = `translateX(${i * (slot + gap)}px)`;
    el.style.opacity = "1";
    el.classList.toggle("last", order.length === CAP && i === CAP - 1);
    el.querySelector(".age").textContent = i === 0 ? "most recent" : order.length === CAP && i === CAP - 1 ? "evicted next" : `${i + 1} of ${CAP}`;
  });
}

function flash(key, cls) {
  const el = els.get(key);
  el.classList.remove("hit", "new"); void el.offsetWidth; el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), 900);
}

function log(kind, key) {
  ops.unshift({ kind, key }); if (ops.length > 10) ops.pop();
  document.getElementById("log").innerHTML = ops.map((o) => `<div class="op"><span class="b ${o.kind}">${o.kind.toUpperCase()}</span><span>${o.key}</span></div>`).join("");
}

function get(key) {
  if (els.has(key)) {
    s.hits++; order = [key, ...order.filter((k) => k !== key)]; flash(key, "hit"); log("hit", key);
  } else {
    s.misses++; log("miss", key);
    if (order.length >= CAP) {
      const out = order.pop(), el = els.get(out);
      els.delete(out); s.evictions++; log("evict", out);
      el.classList.add("gone"); el.style.transform += " translateY(46px)";
      setTimeout(() => el.remove(), 500);
    }
    els.set(key, make(key)); order.unshift(key);
    requestAnimationFrame(() => flash(key, "new"));
  }
  layout();
  const n = s.hits + s.misses;
  document.getElementById("ratio").textContent = n ? `${Math.round((s.hits / n) * 100)}%` : "—";
  for (const k of ["hits", "misses", "evictions"]) document.getElementById(k).textContent = s[k];
}

document.getElementById("form").addEventListener("submit", (e) => { e.preventDefault(); const k = document.getElementById("key").value.trim(); if (k) get(k); });
addEventListener("resize", layout);

// Warm the cache without animation, then let traffic run.
for (let i = 0; i < 40; i++) get(pick());
requestAnimationFrame(() => { lane.classList.remove("instant"); setInterval(() => get(pick()), 1100); });
</script>
</body>
</html>
