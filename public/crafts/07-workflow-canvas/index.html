<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>07 · Workflow canvas — Crafts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b0c0b; --line: #232421; --muted: #6f706b; --dim: #a4a5a1; --text: #ecede9; --teal: #5ca59a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: Geist, ui-sans-serif, system-ui, sans-serif; overflow: hidden; user-select: none; }
  .board { position: fixed; inset: 0; background-image: radial-gradient(circle, #2a2b28 1.1px, transparent 1.1px); background-size: 20px 20px; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  path.wire { fill: none; stroke: #2f3a37; stroke-width: 2; }
  path.flow { fill: none; stroke: var(--teal); stroke-width: 2; stroke-dasharray: 3 11; stroke-linecap: round; animation: flow 1.1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -28; } }
  .node { position: absolute; display: flex; align-items: center; gap: 12px; min-width: 226px; padding: 12px 16px 12px 12px; border: 1px solid #292a27; border-radius: 12px; background: #141513; box-shadow: 0 16px 40px -20px rgba(0,0,0,.8); cursor: grab; }
  .node:active { cursor: grabbing; border-color: #3a3b37; }
  .node.sel { border-color: var(--teal); box-shadow: 0 0 0 1px rgba(92,165,154,.35), 0 16px 40px -18px rgba(92,165,154,.35); }
  .ic { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 9px; background: var(--c); color: #0b0c0b; flex: none; }
  .ic svg { position: static; width: 18px; height: 18px; }
  .t { font: 500 14px/1.2 Geist, sans-serif; letter-spacing: -.01em; }
  .s { margin-top: 4px; font: 400 11px "Geist Mono", monospace; color: var(--muted); }
  .kind { position: absolute; top: -9px; left: 12px; padding: 2px 7px; border-radius: 5px; background: #0b0c0b; border: 1px solid #292a27; font: 500 9px "Geist Mono", monospace; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .dot { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 10px var(--teal); }
  .port { position: absolute; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: #0b0c0b; border: 2px solid #4a4b47; }
  .port.in { left: -6px; } .port.out { right: -6px; }
  .meta { position: fixed; top: 24px; left: 28px; font: 500 12px/1.5 "Geist Mono", ui-monospace, monospace; color: var(--muted); z-index: 2; }
  .meta b { color: var(--dim); font-weight: 500; }
  .run { position: fixed; top: 20px; right: 24px; display: flex; gap: 10px; align-items: center; padding: 9px 14px; border: 1px solid var(--line); border-radius: 10px; background: #111210; font: 500 12px "Geist Mono", monospace; color: var(--dim); z-index: 2; }
  .run i { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); }
  .mini { position: fixed; right: 24px; bottom: 24px; width: 190px; height: 118px; border: 1px solid var(--line); border-radius: 10px; background: rgba(17,18,16,.92); z-index: 2; }
  .mini b { position: absolute; border-radius: 2px; background: #3a3b37; }
  .mini .view { position: absolute; inset: 14px 18px; border: 1px solid rgba(92,165,154,.5); border-radius: 4px; }
  .hint { position: fixed; left: 28px; bottom: 24px; font: 500 12px "Geist Mono", monospace; color: var(--muted); z-index: 2; }
</style>
</head>
<body>
<div class="meta"><b>07</b> / Workflow canvas — drag nodes, wires follow</div>
<div class="run"><i></i>run #1824 · succeeded · 5 steps</div>
<div class="board" id="board"><svg id="wires"></svg></div>
<div class="mini" id="mini"><span class="view"></span></div>
<div class="hint">drag a node</div>
<script>
const ICONS = {
  hook: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 16.5a4.5 4.5 0 1 1-4-7.3L10 3"/><path d="M6 15a4.5 4.5 0 1 0 7.9 2.9H22"/><path d="M13 6.5a4.5 4.5 0 1 1 2.5 8.2L10 21"/></svg>',
  filter: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg>',
  map: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h11M4 12h7M4 17h11"/><path d="m17 9 3 3-3 3"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12z"/></svg>',
  db: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>',
};
const W = innerWidth, H = innerHeight;
const nodes = [
  { id: "hook", kind: "trigger", t: "Webhook", s: "POST /orders", c: "#85c3b8", x: W * 0.06, y: H * 0.44 },
  { id: "filter", kind: "logic", t: "Filter", s: "total > 500", c: "#e8a33c", x: W * 0.28, y: H * 0.30 },
  { id: "map", kind: "transform", t: "Map fields", s: "order → customer", c: "#a4a5a1", x: W * 0.47, y: H * 0.50 },
  { id: "chat", kind: "action", t: "Slack", s: "#sales · new big order", c: "#c98bb9", x: W * 0.70, y: H * 0.28 },
  { id: "db", kind: "action", t: "Postgres", s: "insert into orders", c: "#8fa3c4", x: W * 0.70, y: H * 0.64 },
];
const edges = [["hook", "filter"], ["filter", "map"], ["map", "chat"], ["map", "db"]];

const board = document.getElementById("board"), svg = document.getElementById("wires");
const els = {};
for (const n of nodes) {
  const el = document.createElement("div");
  el.className = "node" + (n.id === "map" ? " sel" : "");
  el.innerHTML = `<span class="kind">${n.kind}</span><span class="port in"></span><span class="ic" style="--c:${n.c}">${ICONS[n.id]}</span><span><div class="t">${n.t}</div><div class="s">${n.s}</div></span><span class="dot"></span><span class="port out"></span>`;
  board.appendChild(el);
  els[n.id] = el;
}

function place() {
  for (const n of nodes) { els[n.id].style.left = `${n.x}px`; els[n.id].style.top = `${n.y}px`; }
  const port = (id, side) => { const el = els[id], n = nodes.find((m) => m.id === id); return [side === "out" ? n.x + el.offsetWidth + 1 : n.x - 1, n.y + el.offsetHeight / 2]; };
  svg.innerHTML = edges.map(([a, b]) => {
    const [x0, y0] = port(a, "out"), [x1, y1] = port(b, "in"), dx = Math.max(60, (x1 - x0) * 0.5);
    const d = `M${x0},${y0} C${x0 + dx},${y0} ${x1 - dx},${y1} ${x1},${y1}`;
    return `<path class="wire" d="${d}"/><path class="flow" d="${d}"/>`;
  }).join("");
  const mini = document.getElementById("mini");
  mini.querySelectorAll("b").forEach((b) => b.remove());
  for (const n of nodes) {
    const b = document.createElement("b");
    Object.assign(b.style, { left: `${10 + (n.x / W) * 170}px`, top: `${10 + (n.y / H) * 98}px`, width: "26px", height: "9px" });
    mini.appendChild(b);
  }
}

let drag = null;
board.addEventListener("pointerdown", (e) => {
  const el = e.target.closest(".node"); if (!el) return;
  const n = nodes.find((m) => els[m.id] === el);
  Object.values(els).forEach((x) => x.classList.remove("sel")); el.classList.add("sel");
  drag = { n, dx: e.clientX - n.x, dy: e.clientY - n.y };
  el.setPointerCapture(e.pointerId);
});
board.addEventListener("pointermove", (e) => { if (!drag) return; drag.n.x = e.clientX - drag.dx; drag.n.y = e.clientY - drag.dy; place(); });
board.addEventListener("pointerup", () => { drag = null; });
document.fonts.ready.then(place);
place();
</script>
</body>
</html>
