<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>08 · Command palette — Crafts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0c0d0c; --line: #262724; --muted: #6f706b; --dim: #a4a5a1; --text: #ecede9; --teal: #5ca59a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: Geist, ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
  .app { position: fixed; inset: 0; display: grid; grid-template-columns: 220px 1fr; filter: blur(1.5px); opacity: .55; }
  .side { border-right: 1px solid #1c1d1b; padding: 70px 18px; display: grid; gap: 12px; align-content: start; }
  .side i, .main i { display: block; height: 10px; border-radius: 5px; background: #1d1e1c; }
  .main { padding: 70px 44px; display: grid; gap: 18px; align-content: start; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .cards div { height: 130px; border: 1px solid #1c1d1b; border-radius: 12px; background: #121311; }
  .rows div { height: 44px; border-bottom: 1px solid #1a1b19; }
  .scrim { position: fixed; inset: 0; background: radial-gradient(800px 500px at 50% 42%, rgba(12,13,12,.35), rgba(12,13,12,.85)); }
  .palette { position: fixed; left: 50%; top: 46%; transform: translate(-50%, -50%); width: min(620px, 90vw); border: 1px solid #2c2d2a; border-radius: 16px; background: rgba(20,21,19,.94); box-shadow: 0 40px 120px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.02) inset; overflow: hidden; }
  .field { display: flex; align-items: center; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
  .field svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
  input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font: 400 17px Geist, sans-serif; letter-spacing: -.01em; caret-color: var(--teal); }
  input::placeholder { color: #55574f; }
  kbd { padding: 3px 7px; border: 1px solid #333430; border-bottom-width: 2px; border-radius: 6px; font: 500 11px "Geist Mono", monospace; color: var(--dim); background: #161715; }
  .list { max-height: 400px; padding: 8px; overflow: auto; }
  .group { padding: 12px 12px 6px; font: 500 11px "Geist Mono", monospace; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .opt { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; font: 400 14px Geist, sans-serif; color: var(--dim); cursor: pointer; }
  .opt .ico { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; background: #1c1d1b; color: var(--dim); flex: none; font: 500 13px Geist, sans-serif; }
  .opt mark { background: none; color: var(--text); font-weight: 600; text-decoration: underline; text-decoration-color: var(--teal); text-underline-offset: 3px; }
  .opt .keys { margin-left: auto; display: flex; gap: 4px; }
  .opt[aria-selected="true"] { background: #1e1f1c; color: var(--text); }
  .opt[aria-selected="true"] .ico { background: var(--teal); color: #0b1412; }
  .foot { display: flex; gap: 18px; padding: 12px 20px; border-top: 1px solid var(--line); font: 400 12px Geist, sans-serif; color: var(--muted); }
  .foot span { display: flex; gap: 6px; align-items: center; }
  .empty { padding: 30px; text-align: center; color: var(--muted); font-size: 14px; }
  .meta { position: fixed; top: 24px; left: 28px; font: 500 12px/1.5 "Geist Mono", ui-monospace, monospace; color: var(--muted); z-index: 3; }
  .meta b { color: var(--dim); font-weight: 500; }
  .toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px); padding: 10px 16px; border: 1px solid var(--line); border-radius: 10px; background: #151614; font: 500 13px Geist, sans-serif; opacity: 0; transition: .35s cubic-bezier(.22,1,.36,1); }
  .toast.on { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body>
<div class="app" aria-hidden="true">
  <div class="side"><i style="width:60%"></i><i></i><i style="width:80%"></i><i style="width:70%"></i><i style="width:50%"></i></div>
  <div class="main"><i style="width:30%;height:16px"></i><div class="cards"><div></div><div></div><div></div></div><div class="rows"><div></div><div></div><div></div><div></div></div></div>
</div>
<div class="scrim"></div>
<div class="meta"><b>08</b> / Command palette — fuzzy matching, grouped, keyboard-first</div>
<div class="palette" role="dialog" aria-label="Command palette">
  <div class="field">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" placeholder="Search commands…" autocomplete="off" aria-controls="list">
    <kbd>esc</kbd>
  </div>
  <div class="list" id="list" role="listbox"></div>
  <div class="foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> run</span><span><kbd>⌘</kbd><kbd>K</kbd> toggle</span></div>
</div>
<div class="toast" id="toast"></div>
<script>
const items = [
  { g: "Actions", t: "Deploy to production", k: ["⌘", "D"], i: "↑" },
  { g: "Actions", t: "Open deployment logs", i: "≡" },
  { g: "Actions", t: "Roll back last deploy", i: "↺" },
  { g: "Actions", t: "Create API key", i: "⚿" },
  { g: "Actions", t: "Invite a teammate", i: "+" },
  { g: "Navigate", t: "Dependencies", k: ["G", "D"], i: "◇" },
  { g: "Navigate", t: "Deployments", k: ["G", "P"], i: "▤" },
  { g: "Navigate", t: "Database · query editor", i: "◎" },
  { g: "Navigate", t: "Settings · webhooks", i: "⚙" },
  { g: "Recent", t: "sniplink · redirect analytics", i: "◷" },
];

// Subsequence match with bonuses for consecutive letters and word starts.
function match(text, q) {
  if (!q) return { score: 0, idx: [] };
  const lower = text.toLowerCase(); let score = 0, prev = -2; const idx = [];
  for (const ch of q.toLowerCase()) {
    const at = lower.indexOf(ch, prev + 1);
    if (at === -1) return null;
    score += 1 + (at === prev + 1 ? 3 : 0) + (at === 0 || lower[at - 1] === " " ? 2 : 0);
    idx.push(at); prev = at;
  }
  return { score: score - lower.length * 0.02, idx };
}

let sel = 0, results = [];
const list = document.getElementById("list"), input = document.getElementById("q");

function render() {
  const q = input.value.trim();
  results = items.map((it) => ({ it, m: match(it.t, q) })).filter((r) => r.m).sort((a, b) => b.m.score - a.m.score);
  if (!q) results = items.map((it) => ({ it, m: { idx: [] } }));
  sel = Math.min(sel, Math.max(0, results.length - 1));
  if (!results.length) { list.innerHTML = `<div class="empty">No commands match “${q}”</div>`; return; }
  let html = "", group = "";
  results.forEach((r, i) => {
    if (!q && r.it.g !== group) { group = r.it.g; html += `<div class="group">${group}</div>`; }
    if (q && i === 0) html += `<div class="group">best matches</div>`;
    const label = [...r.it.t].map((c, j) => (r.m.idx.includes(j) ? `<mark>${c}</mark>` : c)).join("");
    html += `<div class="opt" role="option" aria-selected="${i === sel}" data-i="${i}"><span class="ico">${r.it.i}</span><span>${label}</span>${r.it.k ? `<span class="keys">${r.it.k.map((k) => `<kbd>${k}</kbd>`).join("")}</span>` : ""}</div>`;
  });
  list.innerHTML = html;
}

function run() {
  const r = results[sel]; if (!r) return;
  const toast = document.getElementById("toast");
  toast.textContent = `Ran: ${r.it.t}`; toast.classList.add("on");
  setTimeout(() => toast.classList.remove("on"), 1400);
}

input.addEventListener("input", () => { sel = 0; render(); });
input.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { sel = (sel + 1) % results.length; render(); e.preventDefault(); }
  if (e.key === "ArrowUp") { sel = (sel - 1 + results.length) % results.length; render(); e.preventDefault(); }
  if (e.key === "Enter") run();
  if (e.key === "Escape") { input.value = ""; render(); }
});
list.addEventListener("mousemove", (e) => { const o = e.target.closest(".opt"); if (o && +o.dataset.i !== sel) { sel = +o.dataset.i; render(); } });
list.addEventListener("click", run);

render();
// Type a query on load so the matching is visible at a glance.
[..."dep"].forEach((ch, i) => setTimeout(() => { input.value += ch; sel = 0; render(); }, 450 + i * 170));
setTimeout(() => input.focus(), 50);
</script>
</body>
</html>
