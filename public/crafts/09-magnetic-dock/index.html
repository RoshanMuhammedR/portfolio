<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09 · Magnetic dock — Crafts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --text: #1a1b18; --muted: #6a6b66; --faint: #a4a5a1; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; overflow: hidden; color: var(--text); font-family: Geist, ui-sans-serif, system-ui, sans-serif;
         background: radial-gradient(1100px 620px at 50% 108%, #a9d7cd 0%, #d9eee9 34%, #eef3f0 58%, #f9faf9 100%); }
  .meta { position: fixed; top: 24px; left: 28px; font: 500 12px/1.5 "Geist Mono", ui-monospace, monospace; color: var(--faint); }
  .meta b { color: var(--muted); font-weight: 500; }
  .title { position: fixed; top: 30%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
  .title h1 { margin: 0; font: 600 clamp(28px, 4vw, 46px)/1.05 Geist, sans-serif; letter-spacing: -.035em; }
  .title p { margin: 12px 0 0; font: 400 15px Geist, sans-serif; color: var(--muted); }
  .dock-wrap { position: fixed; left: 50%; bottom: 17%; transform: translateX(-50%); }
  .dock { display: flex; align-items: flex-end; gap: 10px; padding: 10px 12px; border: 1px solid rgba(255,255,255,.7); border-radius: 22px;
          background: rgba(255,255,255,.45); backdrop-filter: blur(20px) saturate(1.4); box-shadow: 0 30px 60px -30px rgba(26,40,36,.45), 0 1px 0 rgba(255,255,255,.9) inset; }
  .app { position: relative; width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; cursor: pointer; background: var(--bg); box-shadow: 0 8px 18px -10px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.35) inset; transform-origin: bottom center; }
  .app svg { width: 46%; height: 46%; color: #fff; }
  .app.bounce { animation: bounce .7s cubic-bezier(.3,1.6,.5,1); }
  @keyframes bounce { 30% { translate: 0 -26px; } 60% { translate: 0 0; } 75% { translate: 0 -8px; } }
  .app .run { position: absolute; bottom: -8px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: #1a1b18; opacity: 0; }
  .app.on .run { opacity: .7; }
  .tip { position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%); padding: 5px 10px; border-radius: 7px; background: rgba(26,27,24,.88); color: #fff; font: 500 12px Geist, sans-serif; white-space: nowrap; opacity: 0; transition: opacity .15s; pointer-events: none; }
  .app.top .tip { opacity: 1; }
  .sep { width: 1px; align-self: stretch; margin: 6px 2px; background: rgba(26,27,24,.12); }
</style>
</head>
<body>
<div class="meta"><b>09</b> / Magnetic dock — cosine falloff, springy launch</div>
<div class="title"><h1>Everything within reach.</h1><p>Point along the dock.</p></div>
<div class="dock-wrap"><div class="dock" id="dock"></div></div>
<script>
const G = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const apps = [
  { n: "Terminal", bg: "linear-gradient(160deg,#3a3b37,#0b0b0a)", i: G('<path d="m5 8 4 4-4 4M12 17h7"/>'), on: true },
  { n: "Editor", bg: "linear-gradient(160deg,#5ca59a,#274845)", i: G('<path d="m9 7-5 5 5 5M15 7l5 5-5 5"/>'), on: true },
  { n: "Browser", bg: "linear-gradient(160deg,#85c3b8,#336e67)", i: G('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>'), on: true },
  { n: "Database", bg: "linear-gradient(160deg,#8fa3c4,#3d4f6b)", i: G('<ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v14c0 1.7 3.1 3 7 3s7-1.3 7-3V5M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/>') },
  { n: "Queues", bg: "linear-gradient(160deg,#e8a33c,#9a5c12)", i: G('<rect x="3" y="4" width="18" height="5" rx="1.5"/><rect x="3" y="11" width="18" height="5" rx="1.5"/><path d="M7 20h10"/>') },
  { sep: true },
  { n: "Mail", bg: "linear-gradient(160deg,#c98bb9,#7a3f6d)", i: G('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>') },
  { n: "Calendar", bg: "linear-gradient(160deg,#f4f5f4,#d4d5d2)", i: G('<rect x="4" y="5" width="16" height="16" rx="2" stroke="#1a1b18"/><path d="M4 10h16M9 3v4M15 3v4" stroke="#1a1b18"/>') },
  { n: "Notes", bg: "linear-gradient(160deg,#f5d77a,#d9a53a)", i: G('<path d="M6 4h9l3 3v13H6z"/><path d="M9 11h6M9 15h4"/>') },
  { n: "Settings", bg: "linear-gradient(160deg,#a4a5a1,#535550)", i: G('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>') },
];
const dock = document.getElementById("dock");
const els = [];
for (const a of apps) {
  if (a.sep) { const s = document.createElement("span"); s.className = "sep"; dock.appendChild(s); continue; }
  const el = document.createElement("button");
  el.className = "app" + (a.on ? " on" : "");
  el.style.setProperty("--bg", a.bg);
  el.setAttribute("aria-label", a.n);
  el.innerHTML = `${a.i}<span class="run"></span><span class="tip">${a.n}</span>`;
  el.onclick = () => { el.classList.remove("bounce"); void el.offsetWidth; el.classList.add("bounce"); el.classList.add("on"); };
  dock.appendChild(el); els.push(el);
}

const BASE = 56, MAX = 1.85, RANGE = 190;
let pointer = null, t = 0;
dock.addEventListener("pointermove", (e) => { pointer = e.clientX; });
dock.addEventListener("pointerleave", () => { pointer = null; });

function frame() {
  t += 1 / 60;
  // Until someone points, a ghost cursor drifts across so the effect is visible.
  const ghost = els[3].getBoundingClientRect();
  const x = pointer ?? ghost.left + ghost.width / 2 + Math.sin(t * 0.8) * 70;
  let best = null, bestScale = 0;
  for (const el of els) {
    const r = el.getBoundingClientRect();
    const d = Math.abs(x - (r.left + r.width / 2));
    const k = d < RANGE ? Math.cos((d / RANGE) * (Math.PI / 2)) : 0;
    const s = 1 + (MAX - 1) * k * k;
    el.style.width = el.style.height = `${BASE * s}px`;
    el.style.borderRadius = `${14 * s}px`;
    if (s > bestScale) { bestScale = s; best = el; }
  }
  els.forEach((el) => el.classList.toggle("top", el === best && bestScale > 1.5));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
