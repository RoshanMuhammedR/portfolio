<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>11 · Deploy replay — Crafts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0a0b0a; --line: #242522; --muted: #6f706b; --dim: #a4a5a1; --text: #ecede9; --teal: #5ca59a; --amber: #e8a33c; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: radial-gradient(1000px 520px at 50% 0%, #13201c 0%, var(--bg) 60%); color: var(--text); font-family: Geist, ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
  .meta { position: fixed; top: 24px; left: 28px; font: 500 12px/1.5 "Geist Mono", ui-monospace, monospace; color: var(--muted); }
  .meta b { color: var(--dim); font-weight: 500; }
  .stage { display: grid; gap: 22px; width: min(900px, 90vw); }
  .term { border: 1px solid #2a2b28; border-radius: 14px; background: #0f100f; box-shadow: 0 50px 120px -40px rgba(0,0,0,.95); overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: #131412; }
  .bar i { width: 11px; height: 11px; border-radius: 50%; background: #2f302c; }
  .bar i:nth-child(1) { background: #e5484d; } .bar i:nth-child(2) { background: #e8a33c; } .bar i:nth-child(3) { background: #5ca59a; }
  .bar span { margin-left: 10px; font: 500 12px "Geist Mono", monospace; color: var(--muted); }
  pre { margin: 0; padding: 22px 24px 26px; min-height: 360px; font: 400 14px/1.75 "Geist Mono", ui-monospace, monospace; color: var(--dim); white-space: pre-wrap; }
  .p { color: var(--teal); } .cmd { color: var(--text); } .ok { color: var(--teal); } .run { color: var(--amber); } .lnk { color: var(--text); text-decoration: underline; text-decoration-color: #3a3b37; text-underline-offset: 3px; }
  .cursor { display: inline-block; width: 8px; height: 17px; margin-left: 2px; vertical-align: -3px; background: var(--text); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .topo { display: flex; align-items: center; justify-content: center; gap: 14px; font: 500 12px "Geist Mono", monospace; color: var(--muted); }
  .topo b { padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: #111210; color: var(--dim); font-weight: 500; transition: border-color .4s, color .4s; }
  .topo b.lit { border-color: #2c5954; color: var(--text); }
  .topo .arr { color: #3a3b37; }
  .replay { all: unset; cursor: pointer; position: fixed; left: 28px; bottom: 24px; padding: 9px 14px; border: 1px solid var(--line); border-radius: 8px; background: #131412; font: 500 12px Geist, sans-serif; color: var(--text); }
</style>
</head>
<body>
<div class="meta"><b>11</b> / Deploy replay — one command, from bare box to routed apps</div>
<main class="stage">
  <div class="term" role="log" aria-live="polite">
    <div class="bar"><i></i><i></i><i></i><span>~/vps-stack</span></div>
    <pre id="out"></pre>
  </div>
  <div class="topo" id="topo"><b data-k="caddy">caddy · https</b><span class="arr">→</span><b data-k="sablier">sablier · scale to zero</b><span class="arr">→</span><b data-k="apps">sniplink · KB-ULT</b><span class="arr">→</span><b data-k="data">postgres · redis</b></div>
</main>
<button class="replay" id="replay">Replay</button>
<script>
const steps = [
  { label: "docker", done: "found", lit: null },
  { label: "networks edge, data, control", done: "created", lit: null },
  { label: "shared postgres + redis", done: "healthy", lit: "data" },
  { label: "proxy/Caddyfile from project routes", done: "rendered", lit: "caddy" },
  { label: "sablier: stop idle apps, wake on request", done: "watching", lit: "sablier" },
  { label: "project sniplink", done: 'up → <span class="lnk">sniplink.dedyn.io</span>', lit: null },
  { label: "project KB-ULT", done: 'up → <span class="lnk">saga.dedyn.io</span>', lit: "apps" },
];
const COMMAND = "python3 orchestrator.py up";
const SPIN = "⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏";
const out = document.getElementById("out");
let timers = [];

const dots = (label) => " " + ".".repeat(Math.max(3, 46 - label.length)) + " ";

function play() {
  timers.forEach(clearTimeout); timers = [];
  document.querySelectorAll(".topo b").forEach((b) => b.classList.remove("lit"));
  let typed = "", lines = [], spinning = -1, frame = 0;
  const render = () => {
    const body = lines.map((l, i) => i === spinning ? `<span class="run">${SPIN[frame % SPIN.length]}</span> ${l.label}${dots(l.label)}` : l.html).join("\n");
    out.innerHTML = `<span class="p">~/vps-stack ❯</span> <span class="cmd">${typed}</span>${lines.length ? "" : '<span class="cursor"></span>'}\n${body}${lines.length === steps.length + 1 ? '\n\n<span class="p">~/vps-stack ❯</span> <span class="cursor"></span>' : ""}`;
  };
  const at = (ms, fn) => timers.push(setTimeout(fn, ms));
  [...COMMAND].forEach((ch, i) => at(300 + i * 45, () => { typed += ch; render(); }));
  let t = 300 + COMMAND.length * 45 + 350;
  const spinner = setInterval(() => { frame++; if (spinning >= 0) render(); }, 80);
  timers.push(spinner);
  steps.forEach((s, i) => {
    at(t, () => { lines.push({ label: s.label }); spinning = lines.length - 1; render(); });
    t += 420 + (i % 3) * 160;
    at(t, () => {
      lines[i].html = `<span class="ok">✓</span> ${s.label}${dots(s.label)}<span class="ok">${s.done}</span>`;
      spinning = -1; render();
      if (s.lit) document.querySelector(`[data-k="${s.lit}"]`).classList.add("lit");
    });
    t += 120;
  });
  at(t + 250, () => {
    lines.push({ html: '\n<span class="cmd">done.</span> 2 projects routed through caddy with automatic https.' });
    clearInterval(spinner); render();
  });
  render();
}
document.getElementById("replay").onclick = play;
play();
</script>
</body>
</html>
