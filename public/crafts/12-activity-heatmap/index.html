<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12 · Activity heatmap — Crafts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f4f5f4; --panel: #ffffff; --line: #e6e6e5; --text: #1a1b18; --muted: #6a6b66; --faint: #a4a5a1;
          --l0: #eceeeb; --l1: #d9eee9; --l2: #a9d7cd; --l3: #5ca59a; --l4: #2c5954; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: Geist, ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
  .meta { position: fixed; top: 24px; left: 28px; font: 500 12px/1.5 "Geist Mono", ui-monospace, monospace; color: var(--faint); }
  .meta b { color: var(--muted); font-weight: 500; }
  .card { width: min(1080px, 92vw); padding: 30px 32px 26px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.03), 0 30px 60px -40px rgba(0,0,0,.25); }
  .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 24px; }
  h1 { margin: 0; font: 600 26px/1.1 Geist, sans-serif; letter-spacing: -.025em; }
  .sub { margin-top: 8px; font: 400 14px Geist, sans-serif; color: var(--muted); }
  .stats { display: flex; gap: 28px; }
  .stat { font: 500 11px "Geist Mono", monospace; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; }
  .stat b { display: block; margin-top: 7px; font: 600 22px/1 Geist, sans-serif; color: var(--text); letter-spacing: -.02em; text-transform: none; }
  .months { display: grid; grid-template-columns: repeat(53, 1fr); margin: 0 0 8px 34px; font: 500 11px "Geist Mono", monospace; color: var(--faint); }
  .body { display: grid; grid-template-columns: 34px 1fr; }
  .days { display: grid; grid-template-rows: repeat(7, 1fr); gap: 4px; font: 500 10px "Geist Mono", monospace; color: var(--faint); }
  .days span { display: flex; align-items: center; }
  .grid { display: grid; grid-template-columns: repeat(53, 1fr); grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; gap: 4px; }
  .d { aspect-ratio: 1; border-radius: 3px; background: var(--l0); opacity: 0; transform: scale(.6); transition: opacity .35s, transform .45s cubic-bezier(.3,1.5,.5,1); cursor: default; }
  .d.in { opacity: 1; transform: none; }
  .d:hover { outline: 2px solid var(--text); outline-offset: 1px; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; font: 400 12px Geist, sans-serif; color: var(--muted); }
  .legend { display: flex; gap: 4px; align-items: center; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; }
  .tip { position: fixed; padding: 7px 10px; border-radius: 8px; background: var(--text); color: #fff; font: 500 12px Geist, sans-serif; pointer-events: none; opacity: 0; transform: translate(-50%, -130%); white-space: nowrap; transition: opacity .12s; }
</style>
</head>
<body>
<div class="meta"><b>12</b> / Activity heatmap — seeded sample data, not real contributions</div>
<main class="card">
  <div class="head">
    <div><h1>A year of commits</h1><div class="sub">Weekdays run hot, weekends cool off, and a release crunch shows up in spring.</div></div>
    <div class="stats"><div class="stat">total<b id="total">0</b></div><div class="stat">longest streak<b id="streak">0</b></div><div class="stat">busiest day<b id="busy">—</b></div></div>
  </div>
  <div class="months" id="months"></div>
  <div class="body">
    <div class="days"><span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span></div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="foot"><span>Hover a day for its count.</span><span class="legend">less <i style="background:var(--l0)"></i><i style="background:var(--l1)"></i><i style="background:var(--l2)"></i><i style="background:var(--l3)"></i><i style="background:var(--l4)"></i> more</span></div>
</main>
<div class="tip" id="tip"></div>
<script>
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(2026);
const start = new Date(2025, 8, 14);          // a year back from the capture date
const grid = document.getElementById("grid");
const levels = ["var(--l0)", "var(--l1)", "var(--l2)", "var(--l3)", "var(--l4)"];
const days = [];
let streak = 0, best = 0, total = 0, busiest = { n: 0, d: null };

for (let i = 0; i < 53 * 7; i++) {
  const d = new Date(start); d.setDate(start.getDate() + i);
  const weekday = d.getDay(), week = Math.floor(i / 7);
  const weekend = weekday === 0 || weekday === 6;
  const crunch = Math.exp(-Math.pow((week - 30) / 4, 2)) * 9;          // a spring release push
  const lull = week > 14 && week < 18 ? 0.25 : 1;                        // a holiday lull
  const base = (weekend ? 1.2 : 4.2) * lull + crunch * (weekend ? 0.4 : 1);
  const n = rng() < (weekend ? 0.55 : 0.12) ? 0 : Math.max(0, Math.round(base + (rng() - 0.4) * 5));
  days.push({ d, n });
  total += n;
  streak = n > 0 ? streak + 1 : 0; best = Math.max(best, streak);
  if (n > busiest.n) busiest = { n, d };
}

const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
let lastMonth = -1, monthsHtml = "";
for (let w = 0; w < 53; w++) {
  const m = days[w * 7].d.getMonth();
  monthsHtml += `<span>${m !== lastMonth ? monthNames[m] : ""}</span>`;
  lastMonth = m;
}
document.getElementById("months").innerHTML = monthsHtml;

grid.innerHTML = days.map(({ n }, i) => {
  const lvl = n === 0 ? 0 : n < 3 ? 1 : n < 6 ? 2 : n < 10 ? 3 : 4;
  return `<div class="d" data-i="${i}" style="background:${levels[lvl]};transition-delay:${Math.floor(i / 7) * 12}ms"></div>`;
}).join("");
requestAnimationFrame(() => requestAnimationFrame(() => grid.querySelectorAll(".d").forEach((el) => el.classList.add("in"))));

document.getElementById("total").textContent = total.toLocaleString();
document.getElementById("streak").textContent = `${best} days`;
document.getElementById("busy").textContent = busiest.d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });

const tip = document.getElementById("tip");
grid.addEventListener("pointermove", (e) => {
  const el = e.target.closest(".d"); if (!el) { tip.style.opacity = 0; return; }
  const { d, n } = days[+el.dataset.i];
  const r = el.getBoundingClientRect();
  tip.textContent = `${n || "No"} commit${n === 1 ? "" : "s"} · ${d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" })}`;
  tip.style.left = `${r.left + r.width / 2}px`; tip.style.top = `${r.top}px`; tip.style.opacity = 1;
});
grid.addEventListener("pointerleave", () => { tip.style.opacity = 0; });
</script>
</body>
</html>
